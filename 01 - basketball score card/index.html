<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="container">
            <div class="home">
                <h3>HOME</h3>
                <p id="score-num-home">0</p>
                <div class="increment-btns">
                    <button onclick="increment('home', 1)">+1</button>
                    <button onclick="increment('home', 2)">+2</button>
                    <button onclick="increment('home', 3)">+3</button>
                </div>
                <div class="reset-btn-home">
                    <button onclick="reset('home')">Reset</button>
                </div>
            </div>
            <div class="guest">
                <h3>GUEST</h3>
                <p id="score-num-guest">0</p>
                <div class="increment-btns">
                    <button onclick="increment('guest', 1)">+1</button>
                    <button onclick="increment('guest', 2)">+2</button>
                    <button onclick="increment('guest', 3)">+3</button>
                </div>
                <div class="reset-btn-guest">
                    <button onclick="reset('guest')">Reset</button>
                </div>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
