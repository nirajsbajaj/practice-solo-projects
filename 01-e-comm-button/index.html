<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-commerce-button</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <div class="container">
        <div class="title-text">
            <h1>Add or Remove</h1>
            <h3>items from your cart</h3>
        </div>

        <div class="add-and-remove" id="add-remove">

            <div class="icon-wrapper">
                <i class="fa-solid fa-trash" id="remove-btn"></i>
                <span class="tooltip">Remove</span>
            </div>

            <p id="count-text">0</p>

            <div class="icon-wrapper">
                <i class="fa-solid fa-plus" id="add-btn"></i>
                <span class="tooltip">Add</span>
            </div>

        </div>

        <p id="reset-btn">Delete</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
