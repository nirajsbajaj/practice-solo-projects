<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <!-- Start Screen -->
        <section class="screen active" id="start-screen">

            <h1>Quiz Time</h1>
            <p>Test your knowledge with these fun questions</p>
            <button id="strt-btn">Start Game</button>

        </section>

        <!-- Quiz Screen -->
        <section class="screen" id="quiz-screen">

            <!-- Question Section -->
            <div class="question-section">
                <h2 id="question-text">Question goes here</h2>
                <div class="quiz-info">
                    <p>Question <span id="current-question">1</span> of <span id="total-questions">5</span></p>

                    <p>Score: <span id="score">0</span></p>
                </div>
            </div>

            <!-- Question and Score -->

            <!-- Answer div -->
            <div class="answer-section" id="answer-section">
                <!-- Answers goes here -->
                 <!-- <p>1</p>
                 <p>2</p>
                 <p>3</p>
                 <p>4</p> -->
            </div>

            <!-- Progress Bar -->
            <div class="progress-bar" >
                <div class="progress" id="progress">
                <!-- Progress Bar -->
                </div>
            </div>

        </section>

        <!-- End Screen -->
        <section class="screen" id="end-screen">

            <h1>Quiz Result</h1>

            <div class="scorecard-section">
                <p>You scored <span id="final-score">0</span> out of <span id="max-score">5</span></p>
                <div id="result-message"></div>
            </div>

            <button id="restart-btn">
                Restart Quiz
            </button>

        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
